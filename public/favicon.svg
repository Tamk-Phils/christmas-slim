<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d5240"/>
      <stop offset="100%" stop-color="#0e2a20"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae19c"/>
      <stop offset="100%" stop-color="#c59b4c"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="16" cy="16" r="15" fill="#0e2a20" stroke="#c59b4c" stroke-width="1.5"/>
  <!-- Gold Star -->
  <polygon points="16,4 17.2,7.5 20.8,7.5 17.9,9.6 19,13 16,10.9 13,13 14.1,9.6 11.2,7.5 14.8,7.5" fill="url(#goldGrad)"/>
  <!-- Tree Tiers -->
  <polygon points="16,8 11,14 14,14 9,20 13,20 7,26 25,26 19,20 23,20 18,14 21,14" fill="#286e57"/>
  <polygon points="16,8 16,26 25,26 19,20 23,20 18,14 21,14" fill="#143d2f"/>
  <!-- Tree Trunk -->
  <rect x="14.5" y="26" width="3" height="3" fill="#891b29" rx="0.5"/>
  <!-- Bauble Accents -->
  <circle cx="12" cy="17" r="1" fill="url(#goldGrad)"/>
  <circle cx="19" cy="18" r="1" fill="#a92739"/>
  <circle cx="14" cy="23" r="1" fill="url(#goldGrad)"/>
  <circle cx="20" cy="24" r="1" fill="#ffd97d"/>
</svg>